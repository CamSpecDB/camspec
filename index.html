<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamSpec — Camera Database</title>

<style>
:root{
  --bg:#0b0d10;
  --card:#13171c;
  --card2:#181d23;
  --text:#f1f3f5;
  --muted:#a5adb7;
  --border:#303740;
  --accent:#dfe3e8;
  --danger:#e06b6b;
}

[data-theme="light"]{
  --bg:#f4f5f7;
  --card:#ffffff;
  --card2:#f0f2f4;
  --text:#15181c;
  --muted:#69727c;
  --border:#d4d9de;
  --accent:#15181c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  transition:.25s;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* HEADER */

header{
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(11,13,16,.94);
  backdrop-filter:blur(12px);
}

[data-theme="light"] header{
  background:rgba(244,245,247,.94);
}

.nav{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:-1.5px;
}

.nav-actions{
  display:flex;
  gap:10px;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 16px;
  border-radius:12px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--text);
}

/* HERO */

.hero{
  padding:75px 0 45px;
}

.hero h1{
  font-size:clamp(42px,7vw,76px);
  letter-spacing:-3px;
  line-height:1;
  margin-bottom:24px;
}

.hero p{
  color:var(--muted);
  font-size:20px;
  max-width:700px;
}

/* FILTERS */

.filters{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  margin-bottom:45px;
}

.filter-grid{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:15px;
}

.field label{
  display:block;
  color:var(--muted);
  margin-bottom:8px;
  font-size:14px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
}

input:focus,select:focus{
  border-color:var(--text);
}

/* RESULTS */

.results-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  gap:15px;
}

.results-count{
  color:var(--muted);
}

/* CAMERA GRID */

.camera-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  padding-bottom:70px;
}

.camera{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  transition:.2s;
}

.camera:hover{
  transform:translateY(-3px);
  border-color:var(--text);
}

.camera-image{
  height:180px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--card2),var(--bg));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  margin-bottom:20px;
}

.brand{
  color:var(--muted);
  font-size:14px;
  margin-bottom:3px;
}

.camera h2{
  font-size:24px;
  margin-bottom:4px;
}

.description{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.specs{
  border-top:1px solid var(--border);
}

.spec{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

.spec span:first-child{
  color:var(--muted);
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:16px;
}

.card-actions button{
  flex:1;
}

.compare-btn.active{
  background:var(--text);
  color:var(--bg);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
  grid-column:1/-1;
}

/* COMPARISON */

.compare-panel{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:18px;
  box-shadow:0 -10px 40px rgba(0,0,0,.35);
  transform:translateY(110%);
  transition:.3s;
}

.compare-panel.open{
  transform:translateY(0);
}

.compare-inner{
  width:min(1000px,92%);
  margin:auto;
}

.compare-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.compare-items{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.compare-item{
  background:var(--card2);
  border:1px solid var(--border);
  padding:15px;
  border-radius:12px;
}

.compare-item h3{
  margin-bottom:8px;
}

/* FOOTER */

footer{
  border-top:1px solid var(--border);
  padding:30px 0;
  color:var(--muted);
  text-align:center;
}

/* MOBILE */

@media(max-width:850px){
  .filter-grid{
    grid-template-columns:1fr 1fr;
  }

  .camera-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .nav{
    min-height:65px;
  }

  .logo{
    font-size:23px;
  }

  .btn{
    padding:9px 11px;
  }

  .hero{
    padding:50px 0 30px;
  }

  .hero h1{
    font-size:48px;
  }

  .hero p{
    font-size:17px;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .camera-grid{
    grid-template-columns:1fr;
  }

  .camera-image{
    height:200px;
  }

  .compare-items{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="container nav">
    <div class="logo">CamSpec</div>

    <div class="nav-actions">
      <button class="btn" id="languageBtn">EN / PT</button>
      <button class="btn" id="themeBtn">☀ / ☾</button>
    </div>
  </div>
</header>

<main class="container">

<section class="hero">
  <h1 id="title">Camera Database</h1>
  <p id="subtitle">
    Explore and compare digital cameras by their specifications.
  </p>
</section>

<section class="filters">

  <div class="filter-grid">

    <div class="field">
      <label id="searchLabel">Search</label>
      <input
        id="search"
        type="text"
        placeholder="Camera or manufacturer"
      >
    </div>

    <div class="field">
      <label id="brandLabel">Brand</label>
      <select id="brand">
        <option value="">All</option>
      </select>
    </div>

    <div class="field">
      <label id="screenLabel">Screen type</label>
      <select id="screen">
        <option value="">All</option>
        <option value="fixed">Fixed</option>
        <option value="tilting">Tilting</option>
        <option value="articulated">Articulated</option>
      </select>
    </div>

    <div class="field">
      <label id="cardLabel">Memory card</label>
      <select id="memory">
        <option value="">All</option>
        <option value="SD">SD</option>
        <option value="CF">CF</option>
        <option value="XQD">XQD</option>
        <option value="CFexpress">CFexpress</option>
      </select>
    </div>

  </div>

</section>

<section>

  <div class="results-header">
    <div class="results-count" id="count">0 cameras found</div>
    <button class="btn" id="clearBtn">Clear filters</button>
  </div>

  <div class="camera-grid" id="cameraGrid"></div>

</section>

</main>

<div class="compare-panel" id="comparePanel">

  <div class="compare-inner">

    <div class="compare-top">
      <strong id="compareTitle">Compare cameras</strong>
      <button class="btn" id="closeCompare">Close</button>
    </div>

    <div class="compare-items" id="compareItems"></div>

  </div>

</div>

<footer>
  <div class="container">
    CamSpec — Digital Camera Database
  </div>
</footer>

<script>

const cameras = [

  {
    id:1,
    brand:"Canon",
    name:"EOS R5",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"45 MP",
    screen:"articulated",
    memory:"CFexpress",
    year:"2020",
    description:"High-resolution full-frame mirrorless camera."
  },

  {
    id:2,
    brand:"Sony",
    name:"A7 III",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"24.2 MP",
    screen:"tilting",
    memory:"SD",
    year:"2018",
    description:"Versatile full-frame camera with excellent autofocus."
  },

  {
    id:3,
    brand:"Nikon",
    name:"D850",
    type:"DSLR",
    sensor:"Full Frame",
    megapixels:"45.7 MP",
    screen:"tilting",
    memory:"SD",
    year:"2017",
    description:"Professional DSLR known for exceptional image quality."
  },

  {
    id:4,
    brand:"Fujifilm",
    name:"X-T5",
    type:"Mirrorless",
    sensor:"APS-C",
    megapixels:"40.2 MP",
    screen:"tilting",
    memory:"SD",
    year:"2022",
    description:"Compact APS-C camera with a high-resolution sensor."
  },

  {
    id:5,
    brand:"Sony",
    name:"A7R IV",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"61 MP",
    screen:"tilting",
    memory:"SD",
    year:"2019",
    description:"Extremely high-resolution full-frame mirrorless camera."
  },

  {
    id:6,
    brand:"Canon",
    name:"EOS R6 Mark II",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"24.2 MP",
    screen:"articulated",
    memory:"SD",
    year:"2022",
    description:"Fast full-frame camera designed for photography and video."
  },

  {
    id:7,
    brand:"Nikon",
    name:"Z8",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"45.7 MP",
    screen:"tilting",
    memory:"CFexpress",
    year:"2023",
    description:"High-end mirrorless camera with professional features."
  },

  {
    id:8,
    brand:"Panasonic",
    name:"Lumix S5 II",
    type:"Mirrorless",
    sensor:"Full Frame",
    megapixels:"24.2 MP",
    screen:"articulated",
    memory:"SD",
    year:"2023",
    description:"Hybrid full-frame camera focused on photo and video."
  },

  {
    id:9,
    brand:"Olympus",
    name:"OM-D E-M1 Mark III",
    type:"Mirrorless",
    sensor:"Micro Four Thirds",
    megapixels:"20.4 MP",
    screen:"articulated",
    memory:"SD",
    year:"2020",
    description:"Compact weather-sealed camera for outdoor photography."
  }

];

let language = "en";
let selectedForCompare = [];

const grid = document.getElementById("cameraGrid");
const search = document.getElementById("search");
const brand = document.getElementById("brand");
const screen = document.getElementById("screen");
const memory = document.getElementById("memory");
const count = document.getElementById("count");
const comparePanel = document.getElementById("comparePanel");
const compareItems = document.getElementById("compareItems");

const translations = {

  en:{
    title:"Camera Database",
    subtitle:"Explore and compare digital cameras by their specifications.",
    searchLabel:"Search",
    placeholder:"Camera or manufacturer",
    brand:"Brand",
    screen:"Screen type",
    memory:"Memory card",
    all:"All",
    found:"cameras found",
    clear:"Clear filters",
    compare:"Compare cameras",
    close:"Close",
    compareBtn:"Compare",
    remove:"Remove",
    screen:"Screen",
    card:"Memory",
    sensor:"Sensor",
    megapixels:"Megapixels",
    type:"Type",
    year:"Year"
  },

  pt:{
    title:"Base de Dados de Câmaras",
    subtitle:"Explore e compare câmaras digitais pelas suas especificações.",
    searchLabel:"Pesquisar",
    placeholder:"Câmara ou fabricante",
    brand:"Marca",
    screen:"Tipo de ecrã",
    memory:"Cartão de memória",
    all:"Todas",
    found:"câmaras encontradas",
    clear:"Limpar filtros",
    compare:"Comparar câmaras",
    close:"Fechar",
    compareBtn:"Comparar",
    remove:"Remover",
    screen:"Ecrã",
    card:"Memória",
    sensor:"Sensor",
    megapixels:"Megapixels",
    type:"Tipo",
    year:"Ano"
  }

};

function populateBrands(){

  const brands = [...new Set(cameras.map(c => c.brand))].sort();

  brands.forEach(b => {

    const option = document.createElement("option");

    option.value = b;
    option.textContent = b;

    brand.appendChild(option);

  });

}

function render(){

  const q = search.value.toLowerCase().trim();

  const filtered = cameras.filter(camera => {

    const matchesSearch =
      !q ||
      camera.name.toLowerCase().includes(q) ||
      camera.brand.toLowerCase().includes(q) ||
      camera.type.toLowerCase().includes(q);

    const matchesBrand =
      !brand.value || camera.brand === brand.value;

    const matchesScreen =
      !screen.value || camera.screen === screen.value;

    const matchesMemory =
      !memory.value || camera.memory === memory.value;

    return (
      matchesSearch &&
      matchesBrand &&
      matchesScreen &&
      matchesMemory
    );

  });

  count.textContent =
    `${filtered.length} ${translations[language].found}`;

  grid.innerHTML = "";

  if(!filtered.length){

    grid.innerHTML = `
      <div class="empty">
        <h2>No cameras found</h2>
        <p>Try changing your filters or search.</p>
      </div>
    `;

    return;
  }

  filtered.forEach(camera => {

    const selected =
      selectedForCompare.includes(camera.id);

    const card = document.createElement("article");

    card.className = "camera";

    card.innerHTML = `

      <div class="camera-image">📷</div>

      <div class="brand">${camera.brand}</div>

      <h2>${camera.name}</h2>

      <p class="description">
        ${camera.description}
      </p>

      <div class="specs">

        <div class="spec">
          <span>${translations[language].type}</span>
          <strong>${camera.type}</strong>
        </div>

        <div class="spec">
          <span>${translations[language].sensor}</span>
          <strong>${camera.sensor}</strong>
        </div>

        <div class="spec">
          <span>${translations[language].megapixels}</span>
          <strong>${camera.megapixels}</strong>
        </div>

        <div class="spec">
          <span>${translations[language].screen}</span>
          <strong>${camera.screen}</strong>
        </div>

        <div class="spec">
          <span>${translations[language].card}</span>
          <strong>${camera.memory}</strong>
        </div>

        <div class="spec">
          <span>${translations[language].year}</span>
          <strong>${camera.year}</strong>
        </div>

      </div>

      <div class="card-actions">

        <button
          class="btn compare-btn ${selected ? "active":""}"
          onclick="toggleCompare(${camera.id})"
        >
          ${selected ? "✓ " : ""}${translations[language].compareBtn}
        </button>

      </div>

    `;

    grid.appendChild(card);

  });

}

function toggleCompare(id){

  if(selectedForCompare.includes(id)){

    selectedForCompare =
      selectedForCompare.filter(x => x !== id);

  }else{

    if(selectedForCompare.length >= 2){

      alert(
        language === "en"
        ? "You can compare up to 2 cameras."
        : "Podes comparar no máximo 2 câmaras."
      );

      return;
    }

    selectedForCompare.push(id);

  }

  updateCompare();

  render();

}

function updateCompare(){

  compareItems.innerHTML = "";

  if(selectedForCompare.length === 0){

    comparePanel.classList.remove("open");

    return;

  }

  comparePanel.classList.add("open");

  selectedForCompare.forEach(id => {

    const camera =
      cameras.find(c => c.id === id);

    const item =
      document.createElement("div");

    item.className = "compare-item";

    item.innerHTML = `

      <h3>${camera.brand} ${camera.name}</h3>

      <p>
        ${translations[language].sensor}:
        <strong>${camera.sensor}</strong>
      </p>

      <p>
        ${translations[language].megapixels}:
        <strong>${camera.megapixels}</strong>
      </p>

      <p>
        ${translations[language].type}:
        <strong>${camera.type}</strong>
      </p>

      <p>
        ${translations[language].card}:
        <strong>${camera.memory}</strong>
      </p>

    `;

    compareItems.appendChild(item);

  });

}

function updateLanguage(){

  const t = translations[language];

  document.documentElement.lang =
    language === "en" ? "en" : "pt";

  document.getElementById("title").textContent =
    t.title;

  document.getElementById("subtitle").textContent =
    t.subtitle;

  document.getElementById("searchLabel").textContent =
    t.searchLabel;

  document.getElementById("search").placeholder =
    t.placeholder;

  document.getElementById("brandLabel").textContent =
    t.brand;

  document.getElementById("screenLabel").textContent =
    t.screen;

  document.getElementById("cardLabel").textContent =
    t.memory;

  document.getElementById("clearBtn").textContent =
    t.clear;

  document.getElementById("compareTitle").textContent =
    t.compare;

  document.getElementById("closeCompare").textContent =
    t.close;

  render();

}

search.addEventListener("input",render);
brand.addEventListener("change",render);
screen.addEventListener("change",render);
memory.addEventListener("change",render);

document.getElementById("clearBtn")
.addEventListener("click",()=>{

  search.value="";
  brand.value="";
  screen.value="";
  memory.value="";

  render();

});

document.getElementById("languageBtn")
.addEventListener("click",()=>{

  language =
    language === "en" ? "pt" : "en";

  updateLanguage();

});

document.getElementById("themeBtn")
.addEventListener("click",()=>{

  const current =
    document.documentElement.getAttribute("data-theme");

  document.documentElement.setAttribute(
    "data-theme",
    current === "light" ? "dark" : "light"
  );

});

document.getElementById("closeCompare")
.addEventListener("click",()=>{

  selectedForCompare = [];

  updateCompare();

  render();

});

populateBrands();
updateLanguage();

</script>

</body>
</html>
